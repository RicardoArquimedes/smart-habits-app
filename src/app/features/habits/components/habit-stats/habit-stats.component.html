<div class="stats">
  <div class="stat">
    <strong>{{ total }}</strong>
    <span>Total</span>
  </div>

  <div class="stat">
    <strong>{{ completed }}</strong>
    <span>Completado</span>
  </div>

  <div class="stat">
    <strong>{{ pending }}</strong>
    <span>Pendiente</span>
  </div>

  <div class="stat progress">
    <strong>{{ progress }}%</strong>
    <span>Progreso</span>
  </div>
</div>
